apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Versioning: versionName comes from the root package.json (or VERSION_NAME),
// versionCode from the VERSION_CODE environment variable, which CI derives
// from the version (scripts/android-version-code.mjs, docs/ANDROID.md).
// ---------------------------------------------------------------------------
def rootPackageJson = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def appVersionName = (System.getenv('VERSION_NAME') ?: rootPackageJson.version.toString()).trim()
def appVersionCode = (System.getenv('VERSION_CODE') ?: '1').trim().toInteger()

// ---------------------------------------------------------------------------
// Release signing: read from environment variables. Without them a release
// build fails, unless ALLOW_DEBUG_SIGNING=true (branch CI, local testing):
// then it is signed with the standard debug keystore (sideload/testing
// only). Google Play requires a real upload key - see docs/ANDROID.md.
// ---------------------------------------------------------------------------
def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def hasReleaseKeystore = releaseKeystorePath != null && !releaseKeystorePath.trim().isEmpty() &&
        new File(releaseKeystorePath.trim()).isFile()
def allowDebugSigning = (System.getenv('ALLOW_DEBUG_SIGNING') ?: '').trim() == 'true'
if (!hasReleaseKeystore) {
    if (allowDebugSigning) {
        logger.lifecycle('Anne\'s Pen: ANDROID_KEYSTORE_PATH not set or missing - release build will be signed with the DEBUG key (ALLOW_DEBUG_SIGNING=true; sideloading/testing only).')
    } else {
        gradle.taskGraph.whenReady { graph ->
            if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
                throw new GradleException('Anne\'s Pen: release signing keystore missing (set ANDROID_KEYSTORE_PATH and the password variables, or ALLOW_DEBUG_SIGNING=true for a debug-signed test build).')
            }
        }
    }
}

android {
    namespace = "io.github.socrtwo.quillpen"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.socrtwo.quillpen"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile new File(releaseKeystorePath.trim())
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword(System.getenv('ANDROID_KEY_PASSWORD') ?: System.getenv('ANDROID_KEYSTORE_PASSWORD'))
            }
        }
    }
    buildFeatures {
        // BuildConfig.APPLICATION_ID names the embed provider's authority (EmbedAssetsProvider).
        buildConfig = true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
    lint {
        // Lint still runs via `./gradlew lint`; it just doesn't gate release packaging.
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Used directly by QuillNativePlugin (FileProvider, IntentCompat, ActivityResult).
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
