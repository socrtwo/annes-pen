name: Android build

# Reusable: builds the APK and AAB and uploads them as the artifacts Annes-Pen-<version>-apk/-aab.
# Called by android.yml (branch CI, debug-signed test builds) and release.yml (signed releases).
# versionCode: scripts/android-version-code.mjs (docs/ANDROID.md, "Version codes").

on:
  workflow_call:
    inputs:
      signed:
        description: 'Sign with the release keystore (secrets ANDROID_KEYSTORE_*); fails when it is missing'
        type: boolean
        default: false
      official:
        description: 'An official release (tag v<version>): versionCode ends in 99'
        type: boolean
        default: false
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      # Unsigned (debug-key) builds only for test runs; gradle refuses them otherwise.
      ALLOW_DEBUG_SIGNING: ${{ !inputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the versionCode counts commits since the version was set
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Read app version
        id: version
        env:
          OFFICIAL: ${{ inputs.official }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$OFFICIAL" == true ]]; then CODE=$(node scripts/android-version-code.mjs --release); else CODE=$(node scripts/android-version-code.mjs); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "Anne's Pen version $VERSION, versionCode $CODE"

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The legacy "tools" package (the action's default) no longer exists in the SDK repository.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        if: inputs.signed
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret not set: release builds must be signed with the release key (docs/ANDROID.md)."
            exit 1
          fi
          KS="$RUNNER_TEMP/quillpen-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Build release APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.signed && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ inputs.signed && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ inputs.signed && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Remove keystore
        if: always() && inputs.signed
        run: rm -f "$RUNNER_TEMP/quillpen-release.jks"

      - name: Collect outputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p out
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          cp "$APK" "out/Annes-Pen-$VERSION.apk"
          cp "$AAB" "out/Annes-Pen-$VERSION.aab"
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Annes-Pen-${{ steps.version.outputs.version }}-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Annes-Pen-${{ steps.version.outputs.version }}-aab
          path: out/*.aab
          if-no-files-found: error
