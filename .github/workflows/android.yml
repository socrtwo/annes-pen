name: Android

# Test builds of the Android app (debug-signed: sideloading and testing only) on every push and pull
# request. Run it from the Actions tab with "prerelease" ticked to publish the build as a GitHub
# prerelease v<version>-android.<run number>. Signed releases for every platform: release.yml.

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish this (debug-signed) build as a GitHub prerelease v<version>-android.<run>'
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/android-build.yml
    with:
      signed: false
      official: false

  publish:
    name: Publish prerelease
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Annes-Pen-*
          path: out
          merge-multiple: true
      - name: Tag and checksums
        id: meta
        run: |
          TAG="v$VERSION-android.$GITHUB_RUN_NUMBER"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then echo "::error::Bad tag $TAG"; exit 1; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then
            echo "::error::Release $TAG already exists"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          (cd out && sha256sum Annes-Pen-* > SHA256SUMS.txt && ls -la)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Anne's Pen ${{ needs.build.outputs.version }} (Android build ${{ github.run_number }})
          prerelease: true
          make_latest: false
          generate_release_notes: true
          body: |
            Debug-signed Android test build from branch `${{ github.ref_name }}` at ${{ github.sha }}.
            Install the APK by sideloading (see docs/ANDROID.md). It cannot update an installed signed release.
          files: |
            out/Annes-Pen-*.apk
            out/Annes-Pen-*.aab
            out/SHA256SUMS.txt
